<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-widht,initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- <link href="./css/style.css" rel="stylesheet"/> -->
<title>Sign Up</title>

</head>

<body class="bg-light vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-sm" style="width: 100%;max-width: 400px;">
        <div class="card-body p-4">
            <h5 class="card-title text-center mb-4">Signin</h5>

            <form id="signupform">

                <div class="mb-3">
                    <label for="fullname" class="form-label">Fullname</label>
                     <input type="text" id="fullname" class="form-control" placeholder="Fullname" required>

                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                     <input type="email" id="email" class="form-control" placeholder="email" required>

                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                     <input type="password" id="password" class="form-control" placeholder="Password" required>

                </div>

                <div class="d-flex justify-content-end mb-3">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>

            </form>

            <div class="text-center">
                <a href="./signin.html" class="d-block text-decoration-none text-primary mb-2">Have already an account?</a>

            </div>

           

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
    <script src="./js/authsignup.js" type="module"></script>
    

</body>

</html>
