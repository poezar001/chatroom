<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-widht,initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- <link href="./css/style.css" rel="stylesheet"/> -->
<title>Reset password</title>

</head>

<body class="bg-light vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-sm" style="width: 100%;max-width: 400px;">
        <div class="card-body p-4">
            <h5 class="card-title text-center mb-4">Reset Password</h5>

            <form id="resetform">


                <div class="mb-3">
                    <label for="signinemail" class="form-label">Email</label>
                     <input type="email" id="signinemail" class="form-control" placeholder="Email" required>

                </div>

                <div class="d-flex justify-content-end mb-3">
                    <button type="submit" class="btn btn-primary">Sent Password Reset Email</button>
                </div>

            </form>
            
            <p id="msg" class="small text-center text-muted"></p>
            <div class="text-center">
                <a href="./signin.html" class="d-block text-decoration-none text-primary mb-2">Have already an account?</a>

            </div>

             <hr class="my-3"/>
            <button type="button" id="googleloginbtn" class="w-100 btn btn-outline-danger"><i class="fab fa-google"></i>Login with google</button>

           

        </div>

    </div>
  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
    <script src="./js/authresetpassword.js" type="module"></script>
    

</body>

</html>
